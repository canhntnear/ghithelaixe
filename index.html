<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coinquarium - Bể Cá Web3 Bán Cầu Đồ Họa</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', system-ui, sans-serif; }
        body { background: #020b18; color: #fff; overflow: hidden; height: 100vh; display: flex; flex-direction: column; }
        
        /* Top Navigation Header */
        header {
            background: rgba(6, 18, 36, 0.75);
            backdrop-filter: blur(16px);
            padding: 12px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(0, 242, 254, 0.15);
            z-index: 10;
        }
        .logo { font-size: 1.5rem; font-weight: 800; color: #00f2fe; text-shadow: 0 0 12px rgba(0,242,254,0.6); display: flex; align-items: center; gap: 8px; }
        .controls { display: flex; gap: 10px; align-items: center; }
        select, input, button {
            padding: 9px 14px; border-radius: 8px; border: 1px solid rgba(0, 242, 254, 0.2);
            background: rgba(10, 25, 47, 0.8); color: #fff; outline: none; font-size: 0.9rem; transition: 0.2s;
        }
        input { width: 280px; }
        input:focus { border-color: #00f2fe; box-shadow: 0 0 10px rgba(0,242,254,0.3); }
        button {
            background: linear-gradient(135deg, #00c6ff, #0072ff);
            border: none; font-weight: 700; cursor: pointer; color: white;
        }
        button:hover { transform: translateY(-1px); box-shadow: 0 4px 15px rgba(0,198,255,0.4); }
        .feed-btn { background: linear-gradient(135deg, #ff0844, #ffb199); }

        /* Stats Bar */
        .stats-bar {
            background: rgba(3, 11, 24, 0.6);
            padding: 10px 24px; font-size: 0.85rem; display: flex; gap: 24px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.03); z-index: 10;
        }
        .stat-item { color: #8892b0; }
        .stat-item span { color: #00f2fe; font-weight: 700; }

        /* Canvas Stage */
        #canvas-container { flex: 1; position: relative; width: 100%; height: 100%; }
        canvas { display: block; width: 100%; height: 100%; }

        /* Crypto HUD Info Card */
        #info-card {
            position: absolute; bottom: 24px; right: 24px;
            background: rgba(10, 25, 47, 0.85); backdrop-filter: blur(12px);
            border: 1px solid rgba(0, 242, 254, 0.3);
            padding: 18px; border-radius: 14px; min-width: 240px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5); display: none; z-index: 20;
        }
        #info-card h4 { color: #fff; margin-bottom: 10px; display: flex; align-items: center; gap: 10px; font-size: 1.1rem; }
        #info-card img { width: 28px; height: 28px; border-radius: 50%; box-shadow: 0 0 8px rgba(255,255,255,0.2); }
        #info-card p { font-size: 0.88rem; margin: 6px 0; color: #a8b2d1; display: flex; justify-content: space-between; }
        #info-card p span { color: #fff; font-weight: 600; }
    </style>
</head>
<body>

    <header>
        <div class="logo">🐠 Coinquarium</div>
        <div class="controls">
            <select id="chain-select">
                <option value="ethereum">Ethereum</option>
                <option value="solana">Solana</option>
                <option value="bsc">BNB Chain</option>
            </select>
            <input type="text" id="wallet-input" placeholder="Dán ví hoặc nhập 'demo-whale'" value="demo-whale">
            <button onclick="scanWallet()">🔍 Quét Ví</button>
            <button class="feed-btn" onclick="feedFish()">🦐 Cho Cá Ăn</button>
        </div>
    </header>

    <div class="stats-bar">
        <div class="stat-item">Tổng giá trị ví: <span id="total-val">$0.00</span></div>
        <div class="stat-item">Số lượng loài: <span id="fish-count">0</span></div>
        <div class="stat-item">Coin chiếm ưu thế: <span id="top-coin">N/A</span></div>
    </div>

    <div id="canvas-container">
        <canvas id="aquarium"></canvas>
        <div id="info-card">
            <h4 id="card-title"><img id="card-icon" src="" alt=""> <span id="card-name">Coin</span></h4>
            <p>Số dư: <span id="card-amount">0</span></p>
            <p>Giá USD: <span id="card-price">$0</span></p>
            <p>Tổng giá trị: <span id="card-total">$0</span></p>
            <p>Biến động 24h: <span id="card-change">0%</span></p>
        </div>
    </div>
