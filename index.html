<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coinquarium - Web3 Aquarium Simulator</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap');
        
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { background: #020813; color: #fff; overflow: hidden; height: 100vh; display: flex; flex-direction: column; }
        
        /* Glassmorphism Header Bar */
        header {
            position: absolute; top: 16px; left: 50%; transform: translateX(-50%);
            width: 92%; max-width: 1200px;
            background: rgba(8, 21, 41, 0.55); backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            padding: 10px 24px; border-radius: 16px;
            display: flex; justify-content: space-between; align-items: center;
            border: 1px solid rgba(0, 242, 254, 0.18);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            z-index: 20;
        }
        .logo { 
            font-size: 1.3rem; font-weight: 800; 
            background: linear-gradient(135deg, #00f2fe, #4facfe);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            display: flex; align-items: center; gap: 8px;
        }
        .controls { display: flex; gap: 10px; align-items: center; }
        input {
            padding: 10px 16px; border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.12);
            background: rgba(4, 15, 31, 0.7); color: #fff; outline: none;
            font-size: 0.85rem; width: 280px; transition: all 0.3s ease;
        }
        input:focus { border-color: #00f2fe; box-shadow: 0 0 12px rgba(0, 242, 254, 0.3); }
        button {
            padding: 10px 18px; border-radius: 12px;
            background: linear-gradient(135deg, #00c6ff 0%, #0072ff 100%);
            border: none; font-weight: 700; cursor: pointer; color: #fff;
            box-shadow: 0 4px 15px rgba(0, 198, 255, 0.3); transition: all 0.2s ease;
        }
        button:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(0, 198, 255, 0.5); }

        /* Floating HUD Stats Bar */
        .stats-hud {
            position: absolute; top: 80px; left: 4%;
            display: flex; gap: 16px; z-index: 20;
        }
        .hud-card {
            background: rgba(8, 21, 41, 0.45); backdrop-filter: blur(12px);
            padding: 8px 16px; border-radius: 12px; border: 1px solid rgba(255, 255, 255, 0.08);
            font-size: 0.8rem; color: #94a3b8;
        }
        .hud-card span { color: #00f2fe; font-weight: 700; font-size: 0.9rem; margin-left: 6px; }

        /* Full Canvas Container */
        #canvas-container { position: relative; width: 100vw; height: 100vh; cursor: crosshair; }
        canvas { display: block; width: 100%; height: 100%; }

        /* In-game Feed Button */
        .in-game-btn {
            position: absolute; bottom: 24px; left: 50%; transform: translateX(-50%);
            background: linear-gradient(135deg, #ff0844, #ffb199);
            border: none; padding: 12px 28px; border-radius: 30px; font-weight: 800;
            color: white; box-shadow: 0 0 20px rgba(255, 8, 68, 0.4); cursor: pointer; z-index: 20;
            transition: all 0.2s ease; letter-spacing: 0.5px;
        }
        .in-game-btn:hover { transform: translateX(-50%) scale(1.05); box-shadow: 0 0 30px rgba(255, 8, 68, 0.7); }

        /* Glass Token Info Card */
        #info-card {
            position: absolute; bottom: 30px; right: 30px;
            background: rgba(8, 21, 41, 0.75); backdrop-filter: blur(20px);
            border: 1px solid rgba(0, 242, 254, 0.3);
            padding: 20px; border-radius: 18px; min-width: 250px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5); display: none; z-index: 20;
            animation: fadeIn 0.3s ease;
        }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        #info-card h4 { color: #fff; margin-bottom: 12px; display: flex; align-items: center; gap: 10px; font-size: 1.1rem; }
        #info-card img { width: 32px; height: 32px; border-radius: 50%; box-shadow: 0 0 10px rgba(255,255,255,0.2); }
        #info-card p { font-size: 0.85rem; margin: 6px 0; color: #94a3b8; display: flex; justify-content: space-between; }
        #info-card p span { color: #fff; font-weight: 600; }

        #loading-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(2, 8, 19, 0.85); backdrop-filter: blur(10px); display: none;
            justify-content: center; align-items: center; flex-direction: column; z-index: 30;
            font-size: 1.2rem; color: #00f2fe; font-weight: 600;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">🪸 Coinquarium</div>
        <div class="controls">
            <input type="text" id="wallet-input" placeholder="Nhập mã Token (LINK, BTC, ETH) hoặc Address..." value="LINK">
            <button onclick="scanWallet()">🔍 Quét Token</button>
        </div>
    </header>

    <div class="stats-hud">
        <div class="hud-card">Vốn hóa bể: <span id="total-mcap">$0.00</span></div>
        <div class="hud-card">Sinh vật: <span id="creature-count">0</span></div>
    </div>

    <div id="canvas-container">
        <button class="in-game-btn" onclick="feedFishAtCenter(event)">🦐 Thả Thức Ăn</button>
        <div id="loading-overlay">⏳ Đang tải hiệu ứng đồ họa...</div>
        <canvas id="aquarium"></canvas>
        
        <div id="info-card">
            <h4 id="card-title"><img id="card-icon" src="" alt=""> <span id="card-name">Token</span></h4>
            <p>Cấp sinh vật: <span id="card-type">Cá</span></p>
            <p>Giá USD: <span id="card-price">$0</span></p>
            <p>Vốn hóa (MCap): <span id="card-mcap">$0</span></p>
            <p>Biến động 24h: <span id="card-change">0%</span></p>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('aquarium');
        const ctx = canvas.getContext('2d');
        
        let width, height;
        let creatures = [];
        let foods = [];
        let bubbles = [];
        let ripples = [];

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        const DEFAULT_CREATURES = [
            { symbol: 'LINK', name: 'Chainlink', mcap: 11000000000, price: 18.2, change: 3.5, icon: 'https://assets.coingecko.com/coins/images/877/small/chainlink.png', color: '#375bd2' },
            { symbol: 'BTC', name: 'Bitcoin', mcap: 1250000000000, price: 64000, change: 2.5, icon: 'https://assets.coingecko.com/coins/images/1/small/bitcoin.png', color: '#f7931a' },
            { symbol: 'ETH', name: 'Ethereum', mcap: 400000000000, price: 3400, change: -1.2, icon: 'https://assets.coingecko.com/coins/images/279/small/ethereum.png', color: '#627eea' },
            { symbol: 'SOL', name: 'Solana', mcap: 68000000000, price: 145, change: 5.8, icon: 'https://assets.coingecko.com/coins/images/4128/small/solana.png', color: '#14f195' },
            { symbol: 'PEPE', name: 'Pepe', mcap: 4000000000, price: 0.000009, change: 12.4, icon: 'https://assets.coingecko.com/coins/images/29850/small/pepe-token.png', color: '#52ae5f' }
        ];

        class ArtisticCreature {
            constructor(data) {
                this.data = data;
                this.mcap = data.mcap || 10000000;
                this.color = data.color || (data.change >= 0 ? '#00f2fe' : '#ff4b4b');

                if (this.mcap >= 100000000000) { this.type = 'WHALE'; this.size = 85; }
                else if (this.mcap >= 10000000000) { this.type = 'SHARK'; this.size = 58; }
                else if (this.mcap >= 1000000000) { this.type = 'FISH'; this.size = 40; }
                else { this.type = 'SHRIMP'; this.size = 24; }

                this.x = Math.random() * (width - 200) + 100;
                this.y = this.type === 'SHRIMP' ? height - 70 : Math.random() * (height - 250) + 120;
                this.vx = (Math.random() - 0.5) * (this.type === 'WHALE' ? 0.8 : 1.6);
                this.vy = this.type === 'SHRIMP' ? 0 : (Math.random() - 0.5) * 1;
                this.angle = 0;
                this.tailPhase = Math.random() * Math.PI * 2;

                this.img = new Image();
                this.img.crossOrigin = "anonymous";
                this.img.src = data.icon;
            }

            update() {
                if (foods.length > 0) {
                    let nearest = foods[0];
                    let minDist = Math.hypot(nearest.x - this.x, nearest.y - this.y);
                    for (let f of foods) {
                        let d = Math.hypot(f.x - this.x, f.y - this.y);
                        if (d < minDist) { minDist = d; nearest = f; }
                    }
                    if (minDist < 350) {
                        this.vx += (nearest.x - this.x) * 0.0008;
                        if (this.type !== 'SHRIMP') this.vy += (nearest.y - this.y) * 0.0008;
                    }
                }

                this.x += this.vx;
                this.y += this.vy;

                if (this.x < this.size || this.x > width - this.size) this.vx *= -1;
                if (this.type !== 'SHRIMP' && (this.y < this.size + 80 || this.y > height - 120)) this.vy *= -1;

                this.angle = Math.atan2(this.vy, this.vx);
                this.tailPhase += 0.12;
            }

            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);

                // Glow Effect Phát Sáng Đồ Hoạ Web3
                ctx.shadowColor = this.color;
                ctx.shadowBlur = 15;

                if (this.type === 'SHRIMP') {
                    ctx.scale(this.vx > 0 ? 1 : -1, 1);
                    this.drawShrimp();
                } else {
                    ctx.rotate(this.angle);
                    if (this.type === 'WHALE') this.drawWhale();
                    else if (this.type === 'SHARK') this.drawShark();
                    else this.drawFish();
                }

                ctx.shadowBlur = 0; // Reset Shadow

                // Logo Token Tròn Đẹp
                if (this.img.complete && this.img.naturalWidth !== 0) {
                    ctx.save();
                    ctx.beginPath();
                    ctx.arc(0, 0, Math.max(10, this.size * 0.32), 0, Math.PI * 2);
                    ctx.clip();
                    ctx.drawImage(this.img, -this.size * 0.32, -this.size * 0.32, this.size * 0.64, this.size * 0.64);
                    ctx.restore();
                }

                ctx.restore();

                // Floating Symbol & Price Label
                ctx.fillStyle = '#ffffff';
                ctx.font = 'bold 12px Plus Jakarta Sans, sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText(`$${this.data.symbol}`, this.x, this.y + this.size + 16);
            }

            drawWhale() {
                let wiggle = Math.sin(this.tailPhase) * 8;
                let grad = ctx.createLinearGradient(-this.size, 0, this.size, 0);
                grad.addColorStop(0, '#0f2027'); grad.addColorStop(0.5, this.color); grad.addColorStop(1, '#2c5364');
                ctx.fillStyle = grad;

                ctx.beginPath();
                ctx.ellipse(0, 0, this.size * 1.3, this.size * 0.65, 0, 0, Math.PI * 2);
                ctx.fill();

                // Đuôi Lụa Cá Voi
                ctx.beginPath();
                ctx.moveTo(-this.size * 1.2, 0);
                ctx.quadraticCurveTo(-this.size * 1.5, wiggle, -this.size * 1.8, wiggle - 25);
                ctx.quadraticCurveTo(-this.size * 1.5, wiggle, -this.size * 1.8, wiggle + 25);
                ctx.closePath();
                ctx.fill();
            }

            drawShark() {
                let wiggle = Math.sin(this.tailPhase) * 10;
                ctx.fillStyle = this.color;

                ctx.beginPath();
                ctx.ellipse(0, 0, this.size, this.size * 0.45, 0, 0, Math.PI * 2);
                ctx.fill();

                // Vây Lưng Sắc Bút
                ctx.beginPath();
                ctx.moveTo(-10, -this.size * 0.3);
                ctx.lineTo(8, -this.size * 0.9);
                ctx.lineTo(22, -this.size * 0.3);
                ctx.fill();

                // Đuôi Cá Mập
                ctx.beginPath();
                ctx.moveTo(-this.size * 0.8, 0);
                ctx.lineTo(-this.size * 1.4, wiggle - 18);
                ctx.lineTo(-this.size * 1.1, wiggle);
                ctx.lineTo(-this.size * 1.4, wiggle + 18);
                ctx.fill();
            }

            drawFish() {
                let wiggle = Math.sin(this.tailPhase) * 9;
                ctx.fillStyle = this.color;

                ctx.beginPath();
                ctx.ellipse(0, 0, this.size, this.size * 0.5, 0, 0, Math.PI * 2);
                ctx.fill();

                ctx.beginPath();
                ctx.moveTo(-this.size * 0.7, 0);
                ctx.lineTo(-this.size * 1.3, wiggle - 12);
                ctx.lineTo(-this.size * 1.3, wiggle + 12);
                ctx.fill();
            }

            drawShrimp() {
                ctx.fillStyle = '#ff7b54';
                ctx.beginPath();
                ctx.arc(0, 0, this.size, Math.PI * 0.9, Math.PI * 1.8);
                ctx.lineWidth = 5;
                ctx.strokeStyle = '#ff7b54';
                ctx.stroke();
            }
        }

        // VẼ KHUNG CẢNH BỂ CÁ NỀN SANG TRỌNG
        function drawAquariumEnvironment() {
            // Gradient Nước Biển Sâu
            let bgGrad = ctx.createLinearGradient(0, 0, 0, height);
            bgGrad.addColorStop(0, '#04152d');
            bgGrad.addColorStop(0.6, '#020d1e');
            bgGrad.addColorStop(1, '#01060f');
            ctx.fillStyle = bgGrad;
            ctx.fillRect(0, 0, width, height);

            // Tia Sáng Mặt Nước (Sun Rays)
            ctx.fillStyle = 'rgba(0, 242, 254, 0.025)';
            for (let i = 0; i < 5; i++) {
                ctx.beginPath();
                ctx.moveTo(width * (0.1 + i * 0.2), 0);
                ctx.lineTo(width * (-0.05 + i * 0.2), height);
                ctx.lineTo(width * (0.15 + i * 0.2), height);
                ctx.fill();
            }

            // Đáy Cát Biển 3D Soft Curve
            let sandGrad = ctx.createLinearGradient(0, height - 100, 0, height);
            sandGrad.addColorStop(0, '#0a223d');
            sandGrad.addColorStop(1, '#040f1c');
            ctx.fillStyle = sandGrad;
            ctx.beginPath();
            ctx.moveTo(0, height - 80);
            ctx.quadraticCurveTo(width * 0.4, height - 120, width, height - 70);
            ctx.lineTo(width, height);
            ctx.lineTo(0, height);
            ctx.fill();

            // Tảo Biển Uốn Lượn
            ctx.fillStyle = 'rgba(0, 230, 118, 0.4)';
            for (let i = 0; i < 7; i++) {
                let x = width * (0.08 + i * 0.14);
                ctx.beginPath();
                ctx.moveTo(x, height - 60);
                let time = Date.now() * 0.002 + i;
                ctx.quadraticCurveTo(x + 25 * Math.sin(time), height - 160, x - 15, height - 260);
                ctx.quadraticCurveTo(x - 25, height - 160, x, height - 60);
                ctx.fill();
            }

            // Bọt Nước Nổi
            if (Math.random() < 0.12) {
                bubbles.push({ x: Math.random() * width, y: height - 60, r: Math.random() * 3 + 1, speed: Math.random() * 1 + 0.6 });
            }
            ctx.strokeStyle = 'rgba(0, 242, 254, 0.3)';
            for (let i = bubbles.length - 1; i >= 0; i--) {
                let b = bubbles[i];
                b.y -= b.speed;
                ctx.beginPath();
                ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
                ctx.stroke();
                if (b.y < 0) bubbles.splice(i, 1);
            }

            // Gợn Sóng Nước Ripple khi Click
            for (let i = ripples.length - 1; i >= 0; i--) {
                let r = ripples[i];
                r.r += 1.5;
                r.alpha -= 0.02;
                ctx.strokeStyle = `rgba(0, 242, 254, ${r.alpha})`;
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.arc(r.x, r.y, r.r, 0, Math.PI * 2);
                ctx.stroke();
                if (r.alpha <= 0) ripples.splice(i, 1);
            }
        }

        async function scanWallet() {
            const query = document.getElementById('wallet-input').value.trim();
            const loader = document.getElementById('loading-overlay');
            if (!query) return;

            loader.style.display = 'flex';

            try {
                const res = await fetch(`https://api.dexscreener.com/latest/dex/search?q=${query}`);
                const json = await res.json();

                if (json.pairs && json.pairs.length > 0) {
                    let scanned = json.pairs.slice(0, 6).map(p => ({
                        symbol: p.baseToken.symbol,
                        name: p.baseToken.name,
                        mcap: p.fdv || p.marketCap || 10000000000,
                        price: parseFloat(p.priceUsd) || 18,
                        change: parseFloat(p.priceChange?.h24) || 0,
                        icon: p.info?.imageUrl || 'https://assets.coingecko.com/coins/images/877/small/chainlink.png',
                        color: p.priceChange?.h24 >= 0 ? '#00f2fe' : '#ff4b4b'
                    }));
                    creatures = scanned.map(c => new ArtisticCreature(c));
                } else {
                    creatures = DEFAULT_CREATURES.map(d => new ArtisticCreature(d));
                }
            } catch (err) {
                creatures = DEFAULT_CREATURES.map(d => new ArtisticCreature(d));
            } finally {
                loader.style.display = 'none';
                updateStats();
            }
        }

        function updateStats() {
            let totalMcap = creatures.reduce((sum, c) => sum + c.mcap, 0);
            document.getElementById('total-mcap').innerText = `$${(totalMcap / 1e6).toFixed(1)}M`;
            document.getElementById('creature-count').innerText = creatures.length;
        }

        // TƯƠNG TÁC THẢ THỨC ĂN
        canvas.addEventListener('click', (e) => {
            const rect = canvas.getBoundingClientRect();
            const clickX = e.clientX - rect.left;
            const clickY = e.clientY - rect.top;

            let clickedCreature = false;
            for (let c of creatures) {
                if (Math.hypot(c.x - clickX, c.y - clickY) < c.size) {
                    showCard(c);
                    clickedCreature = true;
                    break;
                }
            }

            if (!clickedCreature) {
                document.getElementById('info-card').style.display = 'none';
                ripples.push({ x: clickX, y: clickY, r: 5, alpha: 1.0 });
                for (let i = 0; i < 4; i++) {
                    foods.push({ x: clickX + (Math.random() - 0.5) * 20, y: clickY, speed: Math.random() * 1.2 + 0.8 });
                }
            }
        });

        function feedFishAtCenter(e) {
            e.stopPropagation();
            for (let i = 0; i < 8; i++) {
                foods.push({ x: Math.random() * (width - 200) + 100, y: 50, speed: Math.random() * 1.5 + 1 });
            }
        }

        function showCard(c) {
            const card = document.getElementById('info-card');
            document.getElementById('card-icon').src = c.data.icon;
            document.getElementById('card-name').innerText = `${c.data.name} (${c.data.symbol})`;
            document.getElementById('card-type').innerText = c.type === 'WHALE' ? '🐳 Cá Voi Khổng Lồ' : (c.type === 'SHARK' ? '🦈 Cá Mập' : (c.type === 'FISH' ? '🐠 Cá Thường' : '🦐 Tôm Biển'));
            document.getElementById('card-price').innerText = `$${c.data.price.toLocaleString()}`;
            document.getElementById('card-mcap').innerText = `$${(c.mcap / 1e6).toFixed(2)}M`;
            
            const changeEl = document.getElementById('card-change');
            changeEl.innerText = `${c.data.change >= 0 ? '+' : ''}${c.data.change}%`;
            changeEl.style.color = c.data.change >= 0 ? '#00ff88' : '#ff4b4b';

            card.style.display = 'block';
        }

        function animate() {
            ctx.clearRect(0, 0, width, height);

            drawAquariumEnvironment();

            // Thức Ăn Phát Sáng
            ctx.fillStyle = '#ff0844';
            ctx.shadowColor = '#ff0844';
            ctx.shadowBlur = 8;
            for (let i = foods.length - 1; i >= 0; i--) {
                let f = foods[i];
                f.y += f.speed;
                ctx.beginPath();
                ctx.arc(f.x, f.y, 4, 0, Math.PI * 2);
                ctx.fill();

                for (let c of creatures) {
                    if (Math.hypot(c.x - f.x, c.y - f.y) < c.size) {
                        foods.splice(i, 1);
                        break;
                    }
                }
                if (f && f.y > height - 70) foods.splice(i, 1);
            }
            ctx.shadowBlur = 0;

            creatures.forEach(c => {
                c.update();
                c.draw();
            });

            requestAnimationFrame(animate);
        }

        scanWallet();
        animate();
    </script>
</body>
</html>
