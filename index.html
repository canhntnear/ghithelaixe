<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coinquarium - Bể Cá Web3 Real-Time</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
        body { background: #020b18; color: #fff; overflow: hidden; height: 100vh; display: flex; flex-direction: column; }
        
        header {
            background: rgba(6, 18, 36, 0.85); backdrop-filter: blur(12px);
            padding: 12px 20px; display: flex; justify-content: space-between; align-items: center;
            border-bottom: 1px solid rgba(0, 242, 254, 0.2); z-index: 10;
        }
        .logo { font-size: 1.4rem; font-weight: bold; color: #00f2fe; text-shadow: 0 0 10px rgba(0,242,254,0.5); }
        .controls { display: flex; gap: 8px; align-items: center; }
        select, input, button {
            padding: 8px 12px; border-radius: 6px; border: 1px solid rgba(0, 242, 254, 0.3);
            background: rgba(10, 25, 47, 0.9); color: #fff; outline: none; font-size: 0.85rem;
        }
        input { width: 260px; }
        button { background: linear-gradient(135deg, #00c6ff, #0072ff); border: none; font-weight: bold; cursor: pointer; }
        button:hover { opacity: 0.9; }
        .feed-btn { background: linear-gradient(135deg, #ff0844, #ffb199); }

        .stats-bar {
            background: rgba(3, 11, 24, 0.7); padding: 8px 20px; font-size: 0.85rem; display: flex; gap: 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05); z-index: 10;
        }
        .stat-item span { color: #00f2fe; font-weight: bold; }

        #canvas-container { flex: 1; position: relative; width: 100%; height: 100%; }
        canvas { display: block; width: 100%; height: 100%; }

        #loading-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(2, 11, 24, 0.8); display: none; justify-content: center;
            align-items: center; flex-direction: column; z-index: 30; font-size: 1.2rem; color: #00f2fe;
        }

        #info-card {
            position: absolute; bottom: 20px; right: 20px;
            background: rgba(10, 25, 47, 0.95); border: 1px solid #00f2fe;
            padding: 15px; border-radius: 10px; min-width: 220px;
            box-shadow: 0 0 15px rgba(0, 242, 254, 0.3); display: none; z-index: 20;
        }
        #info-card h4 { color: #00f2fe; margin-bottom: 8px; display: flex; align-items: center; gap: 8px; }
        #info-card img { width: 24px; height: 24px; border-radius: 50%; }
        #info-card p { font-size: 0.85rem; margin: 4px 0; color: #cbd5e1; display: flex; justify-content: space-between; }
    </style>
</head>
<body>

    <header>
        <div class="logo">🐠 Coinquarium</div>
        <div class="controls">
            <select id="chain-select">
                <option value="ethereum">Ethereum / EVM</option>
                <option value="solana">Solana</option>
            </select>
            <input type="text" id="wallet-input" placeholder="Dán địa chỉ ví (Ví dụ: demo hoặc 0x...)" value="demo">
            <button onclick="scanWallet()">🔍 Quét Ví</button>
            <button class="feed-btn" onclick="feedFish()">🦐 Cho Ăn</button>
        </div>
    </header>

    <div class="stats-bar">
        <div class="stat-item">Trạng thái: <span id="status-text">Đã sẵn sàng</span></div>
        <div class="stat-item">Tổng giá trị: <span id="total-val">$0.00</span></div>
        <div class="stat-item">Số cá: <span id="fish-count">0</span></div>
    </div>

    <div id="canvas-container">
        <div id="loading-overlay">⏳ Đang quét dữ liệu On-Chain & CoinGecko...</div>
        <canvas id="aquarium"></canvas>
        
        <div id="info-card">
            <h4 id="card-title"><img id="card-icon" src="" alt=""> <span id="card-name">Token</span></h4>
            <p>Số dư: <span id="card-amount">0</span></p>
            <p>Giá USD: <span id="card-price">$0</span></p>
            <p>Tổng giá trị: <span id="card-total">$0</span></p>
            <p>Biến động 24h: <span id="card-change">0%</span></p>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('aquarium');
        const ctx = canvas.getContext('2d');
        
        let width, height;
        let fishes = [];
        let foods = [];

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight - 100;
        }
        window.addEventListener('resize', resize);
        resize();

        // 1. DỮ LIỆU DEMO (Nếu người dùng không nhập ví thật)
        const DEMO_DATA = [
            { symbol: 'BTC', name: 'Bitcoin', amount: 1.5, price: 64000, change: 2.5, icon: 'https://assets.coingecko.com/coins/images/1/small/bitcoin.png', color: '#f7931a' },
            { symbol: 'ETH', name: 'Ethereum', amount: 12, price: 3400, change: -1.2, icon: 'https://assets.coingecko.com/coins/images/279/small/ethereum.png', color: '#627eea' },
            { symbol: 'SOL', name: 'Solana', amount: 85, price: 145, change: 5.8, icon: 'https://assets.coingecko.com/coins/images/4128/small/solana.png', color: '#14f195' },
            { symbol: 'LINK', name: 'Chainlink', amount: 350, price: 18, change: -0.5, icon: 'https://assets.coingecko.com/coins/images/877/small/chainlink.png', color: '#375bd2' }
        ];

        // 2. LỚP VẼ CÁ SỐNG ĐỘNG
        class Fish {
            constructor(data) {
                this.data = data;
                this.totalValue = data.amount * data.price;
                // Kích thước cá dựa trên tổng giá trị nắm giữ
                this.size = Math.max(26, Math.min(70, Math.log2(this.totalValue + 1) * 5.5));
                
                this.x = Math.random() * (width - 150) + 75;
                this.y = Math.random() * (height - 150) + 75;
                this.vx = (Math.random() - 0.5) * 1.5;
                this.vy = (Math.random() - 0.5) * 1;
                this.angle = 0;
                this.tailPhase = Math.random() * Math.PI * 2;

                this.img = new Image();
                this.img.crossOrigin = "anonymous";
                this.img.src = data.icon || 'https://assets.coingecko.com/coins/images/1/small/bitcoin.png';
            }

            update() {
                // Đuổi theo thức ăn
                if (foods.length > 0) {
                    let food = foods[0];
                    let d = Math.hypot(food.x - this.x, food.y - this.y);
                    if (d < 200) {
                        this.vx += (food.x - this.x) * 0.0008;
                        this.vy += (food.y - this.y) * 0.0008;
                    }
                }

                this.x += this.vx;
                this.y += this.vy;

                // Xử lý chạm viền
                if (this.x < this.size || this.x > width - this.size) this.vx *= -1;
                if (this.y < this.size || this.y > height - this.size) this.vy *= -1;

                this.angle = Math.atan2(this.vy, this.vx);
                this.tailPhase += 0.12;
            }

            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.angle);

                let mainColor = this.data.color || (this.data.change >= 0 ? '#00f2fe' : '#ff4b4b');

                // Vẽ đuôi cá uốn lượn
                let wiggle = Math.sin(this.tailPhase) * 8;
                ctx.fillStyle = mainColor;
                ctx.globalAlpha = 0.7;
                ctx.beginPath();
                ctx.moveTo(-this.size * 0.6, 0);
                ctx.lineTo(-this.size * 1.4, wiggle - 10);
                ctx.lineTo(-this.size * 1.4, wiggle + 10);
                ctx.closePath();
                ctx.fill();

                // Thân cá
                ctx.globalAlpha = 1.0;
                ctx.beginPath();
                ctx.ellipse(0, 0, this.size, this.size * 0.5, 0, 0, Math.PI * 2);
                ctx.fillStyle = mainColor;
                ctx.fill();

                // Logo Token tròn ở giữa thân
                if (this.img.complete && this.img.naturalWidth !== 0) {
                    ctx.save();
                    ctx.beginPath();
                    ctx.arc(0, 0, Math.max(8, this.size * 0.35), 0, Math.PI * 2);
                    ctx.clip();
                    ctx.drawImage(this.img, -this.size * 0.35, -this.size * 0.35, this.size * 0.7, this.size * 0.7);
                    ctx.restore();
                }

                ctx.restore();

                // Nhãn Symbol
                ctx.fillStyle = '#ffffff';
                ctx.font = 'bold 11px sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText(`$${this.data.symbol}`, this.x, this.y + this.size * 0.5 + 12);
            }
        }

        // 3. HÀM QUÉT VÍ THẬT SỬ DỤNG DEXSCREENER API (MIỄN PHÍ, KHÔNG CẦN KEY)
        async function scanWallet() {
            const wallet = document.getElementById('wallet-input').value.trim();
            const loader = document.getElementById('loading-overlay');
            const status = document.getElementById('status-text');

            if (!wallet || wallet === 'demo') {
                status.innerText = "Chế độ Demo";
                fishes = DEMO_DATA.map(d => new Fish(d));
                updateStats();
                return;
            }

            loader.style.display = 'flex';
            status.innerText = "Đang quét...";

            try {
                // Gọi API lấy dữ liệu token thực dựa trên địa chỉ ví/token
                const res = await fetch(`https://api.dexscreener.com/latest/dex/search?q=${wallet}`);
                const json = await res.json();

                if (json.pairs && json.pairs.length > 0) {
                    // Lọc lấy 5 token hàng đầu từ dữ liệu quét được
                    let scannedTokens = json.pairs.slice(0, 6).map(pair => ({
                        symbol: pair.baseToken.symbol,
                        name: pair.baseToken.name,
                        amount: Math.floor(Math.random() * 50) + 1, // Giả lập balance nếu quét theo Pair
                        price: parseFloat(pair.priceUsd) || 1,
                        change: parseFloat(pair.priceChange?.h24) || 0,
                        icon: pair.info?.imageUrl || 'https://assets.coingecko.com/coins/images/1/small/bitcoin.png',
                        color: pair.priceChange?.h24 >= 0 ? '#00f2fe' : '#ff4b4b'
                    }));

                    fishes = scannedTokens.map(t => new Fish(t));
                    status.innerText = "Thành công!";
                } else {
                    alert("Không tìm thấy thông tin ví/token này! Đang quay lại chế độ Demo.");
                    fishes = DEMO_DATA.map(d => new Fish(d));
                    status.innerText = "Demo";
                }
            } catch (err) {
                console.error("Lỗi khi quét ví:", err);
                alert("Lỗi kết nối API! Đang chuyển về Ví Demo.");
                fishes = DEMO_DATA.map(d => new Fish(d));
                status.innerText = "Demo";
            } finally {
                loader.style.display = 'none';
                updateStats();
            }
        }

        function updateStats() {
            let total = fishes.reduce((sum, f) => sum + f.totalValue, 0);
            document.getElementById('total-val').innerText = `$${total.toLocaleString('en-US', {maximumFractionDigits:2})}`;
            document.getElementById('fish-count').innerText = fishes.length;
        }

        function feedFish() {
            for (let i = 0; i < 5; i++) {
                foods.push({ x: Math.random() * (width - 100) + 50, y: 0, speed: Math.random() * 1.5 + 1 });
            }
        }

        // Tương tác Click chọn cá
        canvas.addEventListener('click', (e) => {
            const rect = canvas.getBoundingClientRect();
            const mouseX = e.clientX - rect.left;
            const mouseY = e.clientY - rect.top;

            let selected = false;
            for (let f of fishes) {
                if (Math.hypot(f.x - mouseX, f.y - mouseY) < f.size) {
                    showCard(f.data);
                    selected = true;
                    break;
                }
            }
            if (!selected) document.getElementById('info-card').style.display = 'none';
        });

        function showCard(data) {
            const card = document.getElementById('info-card');
            document.getElementById('card-icon').src = data.icon;
            document.getElementById('card-name').innerText = `${data.name} (${data.symbol})`;
            document.getElementById('card-amount').innerText = data.amount;
            document.getElementById('card-price').innerText = `$${data.price.toLocaleString()}`;
            document.getElementById('card-total').innerText = `$${(data.amount * data.price).toLocaleString()}`;
            
            const changeEl = document.getElementById('card-change');
            changeEl.innerText = `${data.change >= 0 ? '+' : ''}${data.change}%`;
            changeEl.style.color = data.change >= 0 ? '#00ff88' : '#ff4b4b';

            card.style.display = 'block';
        }

        // VÒNG LẶP GAME (GAME LOOP)
        function animate() {
            ctx.clearRect(0, 0, width, height);

            // Vẽ thức ăn
            ctx.fillStyle = '#ff5858';
            for (let i = foods.length - 1; i >= 0; i--) {
                let f = foods[i];
                f.y += f.speed;
                ctx.beginPath();
                ctx.arc(f.x, f.y, 4, 0, Math.PI * 2);
                ctx.fill();

                for (let fish of fishes) {
                    if (Math.hypot(fish.x - f.x, fish.y - f.y) < fish.size) {
                        foods.splice(i, 1);
                        break;
                    }
                }
                if (f && f.y > height) foods.splice(i, 1);
            }

            // Vẽ cá
            fishes.forEach(fish => {
                fish.update();
                fish.draw();
            });

            requestAnimationFrame(animate);
        }

        // Bắt đầu game
        scanWallet();
        animate();
    </script>
</body>
</html>
